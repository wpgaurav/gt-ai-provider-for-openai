name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  plugin-header:
    name: Validate plugin header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required plugin-header fields present
        run: |
          set -e
          FILE=gt-ai-provider-for-openai.php
          for field in 'Plugin Name' 'Description' 'Version' 'Requires at least' 'Requires PHP' 'License' 'Text Domain'; do
            if ! grep -qE "^[ *]*${field}:" "$FILE"; then
              echo "::error ::Missing required plugin-header field: $field"
              exit 1
            fi
          done
          echo "All required plugin-header fields present."
